name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # dsh-fabric resolves every @monotykamary/* import through live `file:`
  # entries into a sibling checkout of the DeepSeek Harness monorepo (see
  # package.json and tsconfig.base.json: declaration merging requires shared
  # module identity, so the harness cannot come from npm). CI reproduces the
  # local layout by checking the harness out beside this repository.
  # Bump DSH_HARNESS_REF when the local harness checkout advances.
  DSH_HARNESS_REF: ffcbe75a32ee61521d8f690d5bc4346671361a72

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Checkout DeepSeek Harness (live file target)
        # The file: specs resolve relative to this repository root, so the
        # harness must sit beside the workspace. actions/checkout refuses paths
        # outside the workspace, so clone it directly at the pinned ref.
        run: |
          git init --quiet ../deepseek-harness
          git -C ../deepseek-harness remote add origin https://github.com/monotykamary/deepseek-harness.git
          git -C ../deepseek-harness fetch --depth 1 --quiet origin "$DSH_HARNESS_REF"
          git -C ../deepseek-harness checkout --quiet --detach FETCH_HEAD
          git -C ../deepseek-harness log -1 --oneline
      - name: Install harness workspace
        working-directory: ../deepseek-harness
        run: bun install --frozen-lockfile
      - name: Build harness lib faces
        working-directory: ../deepseek-harness
        run: bun run build:lib:host && bun run build:lib:client
      - run: bun install --frozen-lockfile
      - run: bun run link:harness
      - run: bun run check
