# This layer replaces the default CodeRuntime provider and adds Fabric-owned
# host, mesh, tool, and browser plugins. DSH ToolRuntime and Cordis remain the
# execution-policy and component-lifecycle authorities.
- id: code-runtime
  disabled: true

- id: compaction-basic
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: agent-presets
  disabled: true

- insert:
    - id: dsh-fabric-code-runtime
      name: '@dsh-fabric/code-runtime-quickjs'

    - id: dsh-fabric-compaction
      name: '@dsh-fabric/compaction'
      config:
        auto: false

    - id: dsh-fabric-preset-root
      name: '@dsh-fabric/compaction/presets'

    - id: dsh-fabric-agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      inject:
        - fabricPresetRoot
      config:
        default: standard
        roots:
          - path: !!js ctx.fabricPresetRoot
            trust: system
        includeUserRoot: false

    - id: dsh-fabric-host
      name: '@dsh-fabric/host'

    - id: dsh-fabric-mesh
      name: '@dsh-fabric/mesh/provider'

    - id: dsh-fabric-mesh-tool
      name: '@dsh-fabric/mesh/tool'

    - id: dsh-fabric-ui
      name: '@dsh-fabric/client-ui'
