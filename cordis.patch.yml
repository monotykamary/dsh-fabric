# This layer replaces the default CodeRuntime provider and adds Fabric-owned
# host, mesh, and browser plugins. DSH ToolRuntime and Cordis remain the
# execution-policy and component-lifecycle authorities. The mesh Consumer and
# the system-prompt overlay are NOT here: they mount inside the `fabric`
# preset so their model-facing surfaces stay fabric-scoped.
- id: code-runtime
  disabled: true

- id: compaction-basic
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: agent-presets
  disabled: true

# Fabric masks the DSH todo ledger, goal tools, goal round driver, slash
# command, and goal surface: long-horizon objectives and progress live in
# fabric_mesh instead of same-session todo/goal records.
- id: command-goal
  disabled: true

- id: goal-round-driver
  disabled: true

- id: ui-goal
  disabled: true

# Code Mode keeps DSH ToolRuntime's ordering and exclusive-call barriers, but
# Fabric does not throttle independent run_code sub-calls to DSH's default 10.
- id: tools
  config:
    maxParallelSubCalls: !!js Number.MAX_SAFE_INTEGER

- insert:
    - id: dsh-fabric-code-runtime
      name: '@dsh-fabric/code-runtime-quickjs'

    - id: dsh-fabric-compaction
      name: '@dsh-fabric/compaction'
      config:
        auto: false

    - id: dsh-fabric-preset-root
      name: '@dsh-fabric/compaction/presets'

    - id: dsh-fabric-agent-presets
      name: '@monotykamary/dsh-agent-presets'
      inject:
        - fabricPresetRoot
      config:
        default: standard
        roots:
          - path: !!js ctx.fabricPresetRoot
            trust: system
        includeUserRoot: false

    - id: dsh-fabric-host
      name: '@dsh-fabric/host'

    - id: dsh-fabric-mesh
      name: '@dsh-fabric/mesh/provider'

    - id: dsh-fabric-ui
      name: '@dsh-fabric/client-ui'
